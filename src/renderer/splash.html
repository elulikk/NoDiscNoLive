<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
<style>
  html,body{margin:0;height:100%;background:#0f1420;color:#e8ecf5;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden;-webkit-app-region:drag}
  .w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid #26304a;box-sizing:border-box}
  img{width:96px;height:96px;animation:pop .8s ease-out}
  h1{margin:6px 0 0;font-size:26px;letter-spacing:.5px} h1 b{color:#4c9aff}
  p{margin:0;color:#8e9ab5;font-size:13px}
  .bar{width:220px;height:4px;background:#1c2438;border-radius:3px;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;width:40%;background:#4c9aff;border-radius:3px;animation:l 1.2s infinite ease-in-out}
  @keyframes l{0%{margin-left:-40%}100%{margin-left:100%}}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
</style></head>
<body><div class="w">
  <img src="../../assets/logo.png" alt="MAG">
  <h1>No<b>Disc</b>NoLive</h1>
  <p>Diagnóstico de discos · MAG</p>
  <div class="bar"><i></i></div>
</div></body></html>
